name: voucher_manager
description: "Wi-Fi/Internet Voucher Card Manager for macOS - PDF import, sale, and stock tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (SQLite via FFI - works great on macOS desktop)
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Window Management (Always-on-Top Floating Window)
  window_manager: ^0.3.9

  # PDF Parsing
  syncfusion_flutter_pdf: ^25.2.5

  # File Picker (macOS native file dialog)
  file_picker: ^8.0.3

  # UUID generation for batch/transaction IDs
  uuid: ^4.4.0

  # Value equality for models (Equatable pattern)
  equatable: ^2.0.5

  # Intl for date formatting (Arabic-friendly)
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  fonts:
    - family: Bahij_TheSansArabic
      fonts:
        - asset: fonts/Bahij_TheSansArabic-Plain.ttf
          weight: 400
flutter_launcher_icons:
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
